<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>SVG Plotter v6 - Grouped Timeline</title>
    <style>
        body { font-family: -apple-system, sans-serif; margin: 20px; background: #f8f9fa; display: flex; flex-direction: column; align-items: center; color: #333; }
        .container { display: flex; gap: 20px; max-width: 1450px; width: 100%; align-items: flex-start; }
        .panel { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .input-area { flex: 1.2; min-width: 450px; position: sticky; top: 10px; }
        .preview-area { flex: 2; display: flex; flex-direction: column; align-items: center; min-height: 700px; background: #fafafa; border: 2px dashed #ddd; padding: 20px; border-radius: 12px; }

        .group-card { border: 1px solid #e0e0e0; padding: 15px; border-radius: 8px; margin-bottom: 15px; background: #fff; }
        .group-header { display: flex; gap: 10px; margin-bottom: 8px; align-items: center; }
        .group-header input[type="text"] { flex: 2; padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-weight: bold; }
        .group-header input[type="color"] { width: 40px; height: 32px; cursor: pointer; border: none; background: none; }

        textarea { width: 100%; height: 120px; font-family: "SF Mono", monospace; font-size: 11px; padding: 8px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 4px; line-height: 1.4; }

        .control-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px; padding-top: 15px; border-top: 2px solid #f0f0f0; }
        label { display: block; font-size: 0.8rem; font-weight: bold; margin-bottom: 4px; color: #666; }
        input[type="range"], input[type="number"], select { width: 100%; padding: 6px; }

        button { width: 100%; padding: 14px; margin-top: 10px; cursor: pointer; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; }
        .btn-gen { background: #007bff; color: white; }
        .btn-dl { background: #28a745; color: white; }

        #svg-wrapper { background: white; box-shadow: 0 8px 25px rgba(0,0,0,0.1); border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <div class="panel input-area">
        <h3 style="margin-top:0;">1. Group Data (WT / KO / etc.)</h3>

        <div class="group-card">
            <div class="group-header">
                <input type="text" id="g1Name" value="WT" oninput="updatePlot()">
                <input type="color" id="g1Color" value="#ffffff" oninput="updatePlot()">
                <label>Color</label>
            </div>
            <textarea id="g1Data" oninput="updatePlot()">Day1	Day3	Day7
100	250	400
120	280	450
90	230	380</textarea>
        </div>

        <div class="group-card">
            <div class="group-header">
                <input type="text" id="g2Name" value="KO" oninput="updatePlot()">
                <input type="color" id="g2Color" value="#ffcccc" oninput="updatePlot()">
                <label>Color</label>
            </div>
            <textarea id="g2Data" oninput="updatePlot()">Day1	Day3	Day7
80	150	200
70	140	220
85	160	190</textarea>
        </div>

        <div class="control-grid">
            <div>
                <label>Y-Max (0=Auto)</label>
                <input type="number" id="yMaxInput" value="0" oninput="updatePlot()">
            </div>
            <div>
                <label>Error Bar</label>
                <select id="errorType" onchange="updatePlot()">
                    <option value="se">Mean ± SE</option>
                    <option value="sd">Mean ± SD</option>
                </select>
            </div>
            <div>
                <label>Aspect Ratio</label>
                <input type="range" id="aspectRatio" min="0.4" max="1.5" step="0.05" value="0.7" oninput="updatePlot()">
            </div>
            <div>
                <label>Dot Jitter</label>
                <input type="range" id="jitter" min="0" max="30" value="15" oninput="updatePlot()">
            </div>
        </div>

        <button class="btn-gen" onclick="updatePlot()">Refresh Plot</button>
        <button class="btn-dl" onclick="downloadSVG()">Download SVG</button>
    </div>

    <div class="panel preview-area">
        <div id="svg-wrapper">
            <div id="svg-container"></div>
        </div>
        <p style="font-size: 0.85em; color: #888; margin-top:20px; text-align:center;">
            各タイムポイント（Day）ごとに群が並列表示されます。<br>
            Illustratorで開いて「グループ解除」すると、各群を個別に編集可能です。
        </p>
    </div>
</div>

<script>
function parseTSV(text) {
    const lines = text.trim().split('\n');
    if (lines.length < 2) return { headers: [], data: [] };
    const headers = lines[0].split('\t').map(h => h.trim());
    const data = headers.map(() => []);
    for (let i = 1; i < lines.length; i++) {
        const values = lines[i].split('\t');
        values.forEach((val, idx) => {
            if (val !== undefined && val.trim() !== "" && !isNaN(val)) data[idx].push(parseFloat(val));
        });
    }
    return { headers, data };
}

function calcStats(arr) {
    const n = arr.length;
    if (n === 0) return { mean: 0, sd: 0, se: 0, n: 0 };
    const mean = arr.reduce((a, b) => a + b, 0) / n;
    const variance = n > 1 ? arr.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / (n - 1) : 0;
    const sd = Math.sqrt(variance);
    return { mean, sd, se: sd / Math.sqrt(n), n };
}

function updatePlot() {
    const errorType = document.getElementById('errorType').value;
    const manualY = parseFloat(document.getElementById('yMaxInput').value);
    const aspectRatio = parseFloat(document.getElementById('aspectRatio').value);
    const jitterAmount = parseFloat(document.getElementById('jitter').value);

    // 群情報の取得
    const groupConfigs = [
        { id: '1', name: document.getElementById('g1Name').value, color: document.getElementById('g1Color').value, ...parseTSV(document.getElementById('g1Data').value) },
        { id: '2', name: document.getElementById('g2Name').value, color: document.getElementById('g2Color').value, ...parseTSV(document.getElementById('g2Data').value) }
    ];

    const timePoints = groupConfigs[0].headers; // 基準となるタイムポイント
    if (timePoints.length === 0) return;

    // Y軸スケールの計算
    const allValues = groupConfigs.flatMap(g => g.data.flat());
    const statsAll = groupConfigs.flatMap(g => g.data.map(calcStats));
    const maxStat = Math.max(...statsAll.map(s => s.mean + (errorType==='sd'?s.sd:s.se)));
    const yMax = manualY > 0 ? manualY : (Math.ceil(Math.max(...allValues, maxStat) / 50) * 50 || 100);

    const width = 650, height = width * aspectRatio;
    const pL = 80, pB = 60, pT = 40, pR = 40;
    const graphW = width - pL - pR;
    const yScale = (v) => height - pB - (v / yMax * (height - pB - pT));

    let svgItems = [];
    const strokeW = 1.5;

    // 軸
    svgItems.push(`<line x1="${pL}" y1="${height-pB}" x2="${pL}" y2="${pT}" stroke="black" stroke-width="${strokeW}"/>`);
    svgItems.push(`<line x1="${pL}" y1="${height-pB}" x2="${width-pR}" y2="${height-pB}" stroke="black" stroke-width="${strokeW}"/>`);

    // Y軸目盛り
    for(let i=0; i<=5; i++){
        const val = Math.round(yMax/5*i);
        const y = yScale(val);
        svgItems.push(`<line x1="${pL}" y1="${y}" x2="${pL-6}" y2="${y}" stroke="black" stroke-width="${strokeW}"/>`);
        svgItems.push(`<text x="${pL-12}" y="${y}" text-anchor="end" dominant-baseline="central" font-size="14" font-family="Arial">${val}</text>`);
    }

    // タイムポイントごとの描画
    timePoints.forEach((timeLabel, tIdx) => {
        const xCenter = pL + (tIdx + 0.5) * (graphW / timePoints.length);
        const groupWidth = (graphW / timePoints.length) * 0.7; // 1つのタイムポイント内の描画幅

        groupConfigs.forEach((group, gIdx) => {
            // 各群のXオフセット計算（中心から左右に振り分ける）
            const xOffset = (gIdx - (groupConfigs.length - 1) / 2) * (groupWidth / groupConfigs.length);
            const x = xCenter + xOffset;
            const dataAtTime = group.data[tIdx] || [];
            const s = calcStats(dataAtTime);
            const err = errorType === 'sd' ? s.sd : s.se;

            if (s.n > 0) {
                // エラーバー
                const yM = yScale(s.mean), yT = yScale(s.mean+err), yB = yScale(s.mean-err);
                svgItems.push(`
                <g id="${group.name}_${timeLabel}" stroke="black" stroke-width="${strokeW}">
                    <line x1="${x}" y1="${yB}" x2="${x}" y2="${yT}" />
                    <line x1="${x-8}" y1="${yT}" x2="${x+8}" y2="${yT}" />
                    <line x1="${x-8}" y1="${yB}" x2="${x+8}" y2="${yB}" />
                    <line x1="${x-15}" y1="${yM}" x2="${x+15}" y2="${yM}" stroke-width="${strokeW*2.5}" />
                </g>`);

                // ドット
                dataAtTime.forEach(v => {
                    const jitter = (Math.random()-0.5) * jitterAmount;
                    svgItems.push(`<circle cx="${x+jitter}" cy="${yScale(v)}" r="4.5" fill="${group.color}" stroke="black" stroke-width="${strokeW*0.7}" />`);
                });
            }
        });

        // X軸ラベル
        svgItems.push(`<text x="${xCenter}" y="${height-pB+30}" text-anchor="middle" font-size="14" font-family="Arial" font-weight="bold">${timeLabel}</text>`);
    });

    document.getElementById('svg-container').innerHTML = `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg" style="background:white;">${svgItems.join('')}</svg>`;
}

function downloadSVG() {
    const svg = document.getElementById('svg-container').innerHTML;
    const blob = new Blob([svg], {type: "image/svg+xml"});
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `Grouped_Timeline_${new Date().getTime()}.svg`;
    link.click();
}

updatePlot();
</script>
</body>
</html>
