<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>SVG Plotter v8 - Custom Precision</title>
    <style>
        body { font-family: -apple-system, sans-serif; margin: 20px; background: #f8f9fa; color: #333; }
        .container { display: flex; gap: 20px; max-width: 1600px; margin: 0 auto; align-items: flex-start; }
        .panel { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .input-area { flex: 0 0 420px; position: sticky; top: 10px; }

        /* プレビューエリア */
        .preview-wrapper {
            flex: 1; display: grid; grid-template-columns: 50px 1fr; grid-template-rows: 1fr 50px;
            gap: 10px; background: #fafafa; padding: 40px; border: 2px dashed #ddd; border-radius: 12px;
            align-items: center; justify-items: center;
        }
        .slider-v { grid-column: 1; grid-row: 1; appearance: slider-vertical; width: 12px; height: 400px; }
        .slider-h { grid-column: 2; grid-row: 2; width: 500px; height: 12px; }
        #svg-wrapper { grid-column: 2; grid-row: 1; background: white; box-shadow: 0 8px 25px rgba(0,0,0,0.1); }

        .group-card { border: 1px solid #e0e0e0; padding: 12px; border-radius: 8px; margin-bottom: 15px; }
        .group-header { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
        textarea { width: 100%; height: 70px; font-family: monospace; font-size: 11px; }

        .control-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px; font-size: 0.85rem; }
        label { font-weight: bold; color: #555; display: block; margin-bottom: 3px; }
        input[type="number"], input[type="range"], select { width: 100%; padding: 5px; box-sizing: border-box; }

        button { width: 100%; padding: 12px; margin-top: 10px; cursor: pointer; border: none; border-radius: 6px; font-weight: bold; }
        .btn-gen { background: #007bff; color: white; }
        .btn-dl { background: #28a745; color: white; }
    </style>
</head>
<body>

<div class="container">
    <div class="panel input-area">
        <h3 style="margin-top:0;">Chart Settings</h3>

        <div class="group-card">
            <div class="group-header">
                <input type="text" id="g1Name" value="WT" oninput="updatePlot()">
                <input type="color" id="g1Color" value="#ffffff" oninput="updatePlot()">
                <small>Group 1</small>
            </div>
            <textarea id="g1Data" oninput="updatePlot()">Day1	Day3	Day7
100	250	400
120	280	450
90	230	380</textarea>
        </div>

        <div class="group-card">
            <div class="group-header">
                <input type="text" id="g2Name" value="KO" oninput="updatePlot()">
                <input type="color" id="g2Color" value="#ffcccc" oninput="updatePlot()">
                <small>Group 2</small>
            </div>
            <textarea id="g2Data" oninput="updatePlot()">Day1	Day3	Day7
80	150	200
70	140	220
85	160	190</textarea>
        </div>

        <div class="control-grid">
            <div>
                <label>Font Size (X-axis)</label>
                <input type="number" id="fontSizeX" value="14" oninput="updatePlot()">
            </div>
            <div>
                <label>Font Size (Y-axis)</label>
                <input type="number" id="fontSizeY" value="14" oninput="updatePlot()">
            </div>
            <div>
                <label>Y-Max (0=Auto)</label>
                <input type="number" id="yMaxInput" value="0" oninput="updatePlot()">
            </div>
            <div>
                <label>Y-Axis Ticks</label>
                <input type="number" id="numTicks" value="5" min="1" oninput="updatePlot()">
            </div>
            <div style="grid-column: span 2;">
                <label>Dot Size</label>
                <input type="range" id="dotSize" min="1" max="15" value="4" oninput="updatePlot()">
            </div>
            <div style="grid-column: span 2;">
                <label>Dot Jitter</label>
                <input type="range" id="jitter" min="0" max="40" value="15" oninput="updatePlot()">
            </div>
            <div>
                <label>Error Bar</label>
                <select id="errorType" onchange="updatePlot()">
                    <option value="se">Mean ± SE</option>
                    <option value="sd">Mean ± SD</option>
                </select>
            </div>
        </div>

        <button class="btn-gen" onclick="updatePlot()">Refresh Preview</button>
        <button class="btn-dl" onclick="downloadSVG()">Download SVG</button>
    </div>

    <div class="preview-wrapper">
        <input type="range" class="slider-v" id="chartHeight" min="200" max="800" value="450" oninput="updatePlot()">
        <div id="svg-wrapper">
            <div id="svg-container"></div>
        </div>
        <input type="range" class="slider-h" id="chartWidth" min="300" max="1000" value="650" oninput="updatePlot()">
    </div>
</div>

<script>
function parseTSV(text) {
    const lines = text.trim().split('\n');
    if (lines.length < 2) return { headers: [], data: [] };
    const headers = lines[0].split('\t').map(h => h.trim());
    const data = headers.map(() => []);
    for (let i = 1; i < lines.length; i++) {
        const values = lines[i].split('\t');
        values.forEach((val, idx) => {
            if (val !== undefined && val.trim() !== "" && !isNaN(val)) data[idx].push(parseFloat(val));
        });
    }
    return { headers, data };
}

function calcStats(arr) {
    const n = arr.length;
    if (n === 0) return { mean: 0, sd: 0, se: 0, n: 0 };
    const mean = arr.reduce((a, b) => a + b, 0) / n;
    const variance = n > 1 ? arr.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / (n - 1) : 0;
    const sd = Math.sqrt(variance);
    return { mean, sd, se: sd / Math.sqrt(n), n };
}

function updatePlot() {
    const fsX = parseInt(document.getElementById('fontSizeX').value);
    const fsY = parseInt(document.getElementById('fontSizeY').value);
    const dotR = parseFloat(document.getElementById('dotSize').value);
    const numTicks = parseInt(document.getElementById('numTicks').value);
    const width = parseInt(document.getElementById('chartWidth').value);
    const height = parseInt(document.getElementById('chartHeight').value);
    const errorType = document.getElementById('errorType').value;
    const manualY = parseFloat(document.getElementById('yMaxInput').value);
    const jitterAmount = parseFloat(document.getElementById('jitter').value);

    const groupConfigs = [
        { name: document.getElementById('g1Name').value, color: document.getElementById('g1Color').value, ...parseTSV(document.getElementById('g1Data').value) },
        { name: document.getElementById('g2Name').value, color: document.getElementById('g2Color').value, ...parseTSV(document.getElementById('g2Data').value) }
    ];

    const timePoints = groupConfigs[0].headers;
    if (timePoints.length === 0) return;

    const allValues = groupConfigs.flatMap(g => g.data.flat());
    const statsAll = groupConfigs.flatMap(g => g.data.map(calcStats));
    const maxStat = Math.max(...statsAll.map(s => s.mean + (errorType==='sd'?s.sd:s.se)));
    const yMax = manualY > 0 ? manualY : (Math.ceil(Math.max(...allValues, maxStat) / 10) * 10 || 100);

    const pL = fsY * 3.5, pB = fsX * 3, pT = 30, pR = 30;
    const graphW = width - pL - pR;
    const graphH = height - pB - pT;
    const yScale = (v) => height - pB - (v / yMax * graphH);

    let svgItems = [];
    const strokeW = 1.2;

    // 軸描画
    svgItems.push(`<line x1="${pL}" y1="${height-pB}" x2="${pL}" y2="${pT}" stroke="black" stroke-width="${strokeW}"/>`);
    svgItems.push(`<line x1="${pL}" y1="${height-pB}" x2="${width-pR}" y2="${height-pB}" stroke="black" stroke-width="${strokeW}"/>`);

    // Y軸目盛り（動的分割）
    for(let i=0; i<=numTicks; i++){
        const val = Number((yMax / numTicks * i).toFixed(1));
        const y = yScale(val);
        svgItems.push(`<line x1="${pL}" y1="${y}" x2="${pL-5}" y2="${y}" stroke="black" stroke-width="${strokeW}"/>`);
        svgItems.push(`<text x="${pL-8}" y="${y}" text-anchor="end" dominant-baseline="central" font-size="${fsY}" font-family="Arial">${val}</text>`);
    }

    // データポイント描画
    timePoints.forEach((timeLabel, tIdx) => {
        const xCenter = pL + (tIdx + 0.5) * (graphW / timePoints.length);
        const groupSpace = (graphW / timePoints.length) * 0.75;

        groupConfigs.forEach((group, gIdx) => {
            const xOffset = (gIdx - (groupConfigs.length - 1) / 2) * (groupSpace / groupConfigs.length);
            const x = xCenter + xOffset;
            const dataAtTime = group.data[tIdx] || [];
            const s = calcStats(dataAtTime);
            const err = errorType === 'sd' ? s.sd : s.se;

            if (s.n > 0) {
                const yM = yScale(s.mean), yT = yScale(s.mean+err), yB = yScale(s.mean-err);
                // エラーバー
                svgItems.push(`
                <g id="group_${group.name}_${timeLabel}" stroke="black" stroke-width="${strokeW}">
                    <line x1="${x}" y1="${yB}" x2="${x}" y2="${yT}" />
                    <line x1="${x-6}" y1="${yT}" x2="${x+6}" y2="${yT}" />
                    <line x1="${x-6}" y1="${yB}" x2="${x+6}" y2="${yB}" />
                    <line x1="${x-12}" y1="${yM}" x2="${x+12}" y2="${yM}" stroke-width="${strokeW*2.5}" />
                </g>`);

                // 個別ドット
                dataAtTime.forEach(v => {
                    const jitter = (Math.random()-0.5) * jitterAmount;
                    svgItems.push(`<circle cx="${x+jitter}" cy="${yScale(v)}" r="${dotR}" fill="${group.color}" stroke="black" stroke-width="${strokeW*0.8}" />`);
                });
            }
        });
        // X軸ラベル
        svgItems.push(`<text x="${xCenter}" y="${height-pB+fsX+10}" text-anchor="middle" font-size="${fsX}" font-family="Arial" font-weight="bold">${timeLabel}</text>`);
    });

    document.getElementById('svg-container').innerHTML = `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg" style="background:white;">${svgItems.join('')}</svg>`;
}

function downloadSVG() {
    const svg = document.getElementById('svg-container').innerHTML;
    const blob = new Blob([svg], {type: "image/svg+xml"});
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `Graph_Export_${new Date().getTime()}.svg`;
    link.click();
}

updatePlot();
</script>
</body>
</html>
