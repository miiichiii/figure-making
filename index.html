<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>BioStat SVG Plotter v12</title>
    <style>
        :root { --primary: #007bff; --success: #28a745; --bg: #f4f7f9; }
        body { font-family: -apple-system, sans-serif; margin: 0; background: var(--bg); display: flex; height: 100vh; overflow: hidden; }

        /* Layout */
        .input-area { flex: 0 0 380px; min-width: 250px; background: white; border-right: 1px solid #ddd; padding: 20px; overflow-y: auto; z-index: 100; }
        .resizer { width: 6px; cursor: col-resize; background: #eee; transition: background 0.2s; }
        .resizer:hover { background: var(--primary); }
        .main-content { flex: 1; display: flex; flex-direction: column; gap: 20px; padding: 20px; overflow-y: auto; }

        .panel { background: white; padding: 18px; border-radius: 10px; box-shadow: 0 3px 10px rgba(0,0,0,0.06); }
        h3 { margin: 0 0 15px 0; font-size: 1rem; color: #444; border-bottom: 2px solid #eee; padding-bottom: 5px; }

        /* Group Cards */
        .group-card { border: 1px solid #eef; padding: 10px; border-radius: 8px; margin-bottom: 12px; position: relative; background: #fff; }
        .btn-remove { position: absolute; top: 5px; right: 5px; background: #ffeded; color: #ff4444; border: 1px solid #ffcccc; border-radius: 4px; cursor: pointer; }
        textarea { width: 100%; height: 60px; font-family: monospace; font-size: 11px; margin-top: 5px; border: 1px solid #ddd; border-radius: 4px; resize: vertical; }

        /* Visual Controls (Moved to Right) */
        .visual-controls { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
        .control-item { display: flex; flex-direction: column; gap: 4px; font-size: 0.8rem; font-weight: bold; }

        /* Preview area */
        .preview-container { display: flex; align-items: center; justify-content: center; gap: 15px; background: #e9ecef; padding: 30px; border-radius: 12px; min-height: 450px; }
        .slider-v { appearance: slider-vertical; height: 350px; width: 12px; }
        .slider-h { width: 500px; height: 12px; }
        #svg-wrapper { background: white; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }

        .btn-main { width: 100%; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-add { background: #f0f0f0; color: #555; border: 1px solid #ddd; }
        .btn-dl { background: var(--success); color: white; margin-top: 20px; font-size: 1rem; }
    </style>
</head>
<body>

<aside class="input-area" id="leftPanel">
    <h3>1. Data Input</h3>
    <div style="background: #fff4e6; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 0.85rem;">
        <label style="cursor:pointer; font-weight:bold; color:#d9480f;">
            <input type="checkbox" id="comparisonMode" onchange="toggleMode()"> Comparison Mode (群比較)
        </label>
    </div>

    <div id="timelineSection" style="margin-bottom: 15px;">
        <label style="font-size:0.8rem; font-weight:bold;">Time Labels</label>
        <input type="text" id="timePointsInput" value="Day1 Day3 Day7" style="width:100%; padding:5px;" oninput="updatePlot()">
    </div>

    <div id="groupsContainer"></div>
    <button class="btn-main btn-add" onclick="addNewGroup()">+ Add New Group</button>

    <button class="btn-main btn-dl" onclick="downloadSVG()">Download SVG (Illustrator)</button>
</aside>

<div class="resizer" id="resizerHandle"></div>

<main class="main-content">
    <div class="preview-container">
        <input type="range" class="slider-v" id="chartHeight" min="50" max="1000" value="400" oninput="updatePlot()">
        <div id="svg-wrapper">
            <div id="svg-container"></div>
            <div style="text-align:center; padding: 5px;">
                <input type="range" class="slider-h" id="chartWidth" min="50" max="1200" value="500" oninput="updatePlot()">
            </div>
        </div>
    </div>

    <div class="panel">
        <h3>2. Aesthetics & Annotations</h3>
        <div class="visual-controls">
            <div class="control-item">
                <label>Font Size (X / Y)</label>
                <div style="display:flex; gap:5px;">
                    <input type="number" id="fontSizeX" value="14" oninput="updatePlot()">
                    <input type="number" id="fontSizeY" value="14" oninput="updatePlot()">
                </div>
            </div>
            <div class="control-item">
                <label>Dot Size & Jitter</label>
                <div style="display:flex; gap:5px;">
                    <input type="range" id="dotSize" min="1" max="15" value="4" oninput="updatePlot()">
                    <input type="range" id="jitter" min="0" max="40" value="15" oninput="updatePlot()">
                </div>
            </div>
            <div class="control-item">
                <label>Y-Axis (Max / Ticks)</label>
                <div style="display:flex; gap:5px;">
                    <input type="number" id="yMaxInput" value="0" placeholder="Auto" oninput="updatePlot()">
                    <input type="number" id="numTicks" value="5" oninput="updatePlot()">
                </div>
            </div>
            <div class="control-item">
                <label>Significance / Options</label>
                <div style="font-size: 0.75rem;">
                    <label><input type="checkbox" id="autoBrackets" checked onchange="updatePlot()"> Auto Brackets (*)</label><br>
                    <label><input type="checkbox" id="showLegend" checked onchange="updatePlot()"> Show Legend</label>
                </div>
            </div>
        </div>
    </div>

    <div class="panel">
        <h3>3. Statistical Results</h3>
        <div id="statsTableContainer"></div>
    </div>
</main>

<script>
function toggleMode() {
    const isComp = document.getElementById('comparisonMode').checked;
    document.getElementById('timelineSection').style.visibility = isComp ? 'hidden' : 'visible';
    updatePlot();
}

let groupCount = 0;
function addNewGroup(name = "", color = "", data = "") {
    groupCount++;
    const id = `group_${groupCount}`;
    const palette = ['#ffffff', '#ffcccc', '#ccffcc', '#ccccff', '#fff3bf'];
    const colorVal = color || palette[groupCount % palette.length];
    const nameVal = name || (groupCount === 1 ? "WT" : groupCount === 2 ? "KO" : `Drug ${groupCount - 2}`);
    const html = `
        <div class="group-card" id="${id}">
            <button class="btn-remove" onclick="document.getElementById('${id}').remove(); updatePlot();">×</button>
            <div style="display:flex; gap:5px; align-items:center;">
                <input type="text" class="group-name-input" value="${nameVal}" style="flex:1" oninput="updatePlot()">
                <input type="color" class="group-color-input" value="${colorVal}" style="width:30px" oninput="updatePlot()">
            </div>
            <textarea class="group-data-input" oninput="handlePaste('${id}')" placeholder="Paste data...">${data}</textarea>
        </div>`;
    document.getElementById('groupsContainer').insertAdjacentHTML('beforeend', html);
    updatePlot();
}

function handlePaste(id) {
    const card = document.getElementById(id);
    const textarea = card.querySelector('.group-data-input');
    const text = textarea.value.trim();
    if (!text) return;

    const lines = text.split('\n');
    const firstLine = lines[0].split('\t');
    const isHeader = firstLine.some(cell => isNaN(parseFloat(cell)) && cell !== "");
    const isCompMode = document.getElementById('comparisonMode').checked;

    if (isHeader && id === document.querySelector('.group-card').id && !isCompMode) {
        document.getElementById('timePointsInput').value = firstLine.join(' ');
    }
    updatePlot();
}

function parseData(text, expectedCount) {
    const lines = text.trim().split('\n');
    if (lines.length === 0 || text === "") return [];

    let startIdx = 0;
    const firstLineCells = lines[0].split('\t');
    if (firstLineCells.some(cell => isNaN(parseFloat(cell)) && cell !== "")) {
        startIdx = 1;
    }

    const result = Array.from({ length: expectedCount }, () => []);
    for (let i = startIdx; i < lines.length; i++) {
        const values = lines[i].split('\t');
        for (let j = 0; j < expectedCount; j++) {
            if (values[j] !== undefined && values[j].trim() !== "" && !isNaN(values[j])) {
                result[j].push(parseFloat(values[j]));
            }
        }
    }
    return result;
}

function calcStats(arr) {
    const n = arr.length;
    if (n === 0) return { mean: 0, sd: 0, se: 0, n: 0 };
    const mean = arr.reduce((a, b) => a + b, 0) / n;
    const variance = n > 1 ? arr.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / (n - 1) : 0;
    const sd = Math.sqrt(variance);
    return { mean, sd, se: sd / Math.sqrt(n), n };
}

function welchTTest(a, b) {
    const s1 = calcStats(a), s2 = calcStats(b);
    if (s1.n < 2 || s2.n < 2) return null;
    const v1 = Math.pow(s1.sd, 2), v2 = Math.pow(s2.sd, 2);
    const t = Math.abs(s1.mean - s2.mean) / Math.sqrt(v1 / s1.n + v2 / s2.n);
    const df = Math.pow(v1 / s1.n + v2 / s2.n, 2) / (Math.pow(v1 / s1.n, 2) / (s1.n - 1) + Math.pow(v2 / s2.n, 2) / (s2.n - 1));
    const p = 2 * (1 - normalCDF(Math.abs(t)));
    return { t, p, df, method: "Welch's t-test" };
}

function oneWayANOVA(groupsData) {
    const validGroups = groupsData.filter(g => g.length > 1);
    if (validGroups.length < 3) return null;

    const allData = validGroups.flat();
    const grandMean = allData.reduce((a, b) => a + b, 0) / allData.length;

    let ssBetween = 0, ssWithin = 0;
    validGroups.forEach(group => {
        const m = group.reduce((a, b) => a + b, 0) / group.length;
        ssBetween += group.length * Math.pow(m - grandMean, 2);
        group.forEach(v => { ssWithin += Math.pow(v - m, 2); });
    });

    const dfBetween = validGroups.length - 1;
    const dfWithin = allData.length - validGroups.length;
    const msBetween = ssBetween / dfBetween;
    const msWithin = ssWithin / dfWithin;
    const f = msBetween / msWithin;

    return { f, df1: dfBetween, df2: dfWithin, msWithin, method: "One-way ANOVA" };
}

function brunnerMunzel(x, y) {
    const n1 = x.length, n2 = y.length;
    if (n1 < 2 || n2 < 2) return { p: 1.0, w: 0 };

    const combined = [...x.map(v => ({ v, g: 1 })), ...y.map(v => ({ v, g: 2 }))].sort((a, b) => a.v - b.v);
    combined.forEach((d, i) => d.r = i + 1);

    const r1 = combined.filter(d => d.g === 1).map(d => d.r);
    const r2 = combined.filter(d => d.g === 2).map(d => d.r);

    const s1 = x.slice().sort((a, b) => a - b).map((v, i) => i + 1);
    const s2 = y.slice().sort((a, b) => a - b).map((v, i) => i + 1);

    const m1 = r1.reduce((a, b) => a + b, 0) / n1;
    const m2 = r2.reduce((a, b) => a + b, 0) / n2;

    const v1 = r1.reduce((sum, ri, i) => sum + Math.pow(ri - s1[i] - m1 + (n1 + 1) / 2, 2), 0) / (n1 - 1);
    const v2 = r2.reduce((sum, rj, i) => sum + Math.pow(rj - s2[i] - m2 + (n2 + 1) / 2, 2), 0) / (n2 - 1);

    const w = (n1 * n2 * (m2 - m1)) / ((n1 + n2) * Math.sqrt(n1 * v1 + n2 * v2));
    const df = Math.pow(n1 * v1 + n2 * v2, 2) / (Math.pow(n1 * v1, 2) / (n1 - 1) + Math.pow(n2 * v2, 2) / (n2 - 1));
    const p = 2 * (1 - normalCDF(Math.abs(w)));
    return { p, w, df };
}

function normalCDF(x) {
    const t = 1 / (1 + 0.2316419 * Math.abs(x));
    const d = 0.3989423 * Math.exp(-x * x / 2);
    const p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + 1.330274 * t))));
    return x > 0 ? 1 - p : p;
}

function ibeta(x, a, b) {
    let bt = (x > 0 && x < 1) ? Math.exp(logGamma(a + b) - logGamma(a) - logGamma(b) + a * Math.log(x) + b * Math.log(1 - x)) : 0;
    if (x < (a + 1) / (a + b + 2)) return bt * betacf(x, a, b) / a;
    return 1 - bt * betacf(1 - x, b, a) / b;
}
function logGamma(z) {
    const c = [76.18009172947146, -86.50532032941677, 24.01409824083091, -1.231739572450155, 0.1208650973866179e-2, -0.5395239384953e-5];
    let x = y = z, tmp = x + 5.5;
    tmp -= (x + 0.5) * Math.log(tmp);
    let ser = 1.000000000190015;
    for (let i = 0; i < 6; i++) ser += c[i] / ++y;
    return -tmp + Math.log(2.5066282746310005 * ser / x);
}
function betacf(x, a, b) {
    let qab = a + b, qap = a + 1, qam = a - 1, c = 1, d = 1 - qab * x / qap;
    if (Math.abs(d) < 1e-10) d = 1e-10;
    d = 1 / d;
    let h = d;
    for (let m = 1; m <= 100; m++) {
        let m2 = 2 * m, aa = m * (b - m) * x / ((qam + m2) * (a + m2));
        d = 1 + aa * d; if (Math.abs(d) < 1e-10) d = 1e-10;
        c = 1 + aa / c; if (Math.abs(c) < 1e-10) c = 1e-10;
        d = 1 / d; h *= d * c;
        aa = -(a + m) * (qab + m) * x / ((a + m2) * (qap + m2));
        d = 1 + aa * d; if (Math.abs(d) < 1e-10) d = 1e-10;
        c = 1 + aa / c; if (Math.abs(c) < 1e-10) c = 1e-10;
        d = 1 / d; h *= d * c;
        if (Math.abs(h - 1) < 1e-7) break;
    }
    return h;
}

function fDistributionP(F, df1, df2) {
    if (F <= 0) return 1.0;
    const x = df2 / (df2 + df1 * F);
    const a = df2 / 2;
    const b = df1 / 2;
    return ibeta(x, a, b);
}

function runDunnett(groupsData, msWithin, dfWithin) {
    const control = groupsData[0];
    const results = [];
    const n1 = control.length;
    const mean1 = control.reduce((a, b) => a + b, 0) / n1;

    for (let i = 1; i < groupsData.length; i++) {
        const treat = groupsData[i];
        const n2 = treat.length;
        const mean2 = treat.reduce((a, b) => a + b, 0) / n2;

        const se = Math.sqrt(msWithin * (1 / n1 + 1 / n2));
        const tVal = Math.abs(mean1 - mean2) / se;

        const k = groupsData.length - 1;
        const rawP = 2 * (1 - studentTCDF(tVal, dfWithin));
        const adjustedP = Math.min(1.0, rawP * k);

        results.push({
            targetName: `Group ${i + 1}`,
            p: adjustedP,
            isSig: adjustedP < 0.05
        });
    }
    return results;
}

function studentTCDF(t, df) {
    const x = df / (df + t * t);
    return 1 - 0.5 * ibeta(x, df / 2, 0.5);
}

function getStars(p) {
    if (p < 0.001) return "***";
    if (p < 0.01) return "**";
    if (p < 0.05) return "*";
    return "";
}

function drawBracket(x1, x2, y, stars, fontSize) {
    const tickH = 6;
    return `
    <g class="sig-bracket" stroke="black" fill="none" stroke-width="1.2">
        <path d="M ${x1} ${y} L ${x1} ${y - tickH} L ${x2} ${y - tickH} L ${x2} ${y}" />
        <text x="${(x1 + x2) / 2}" y="${y - tickH - 2}" fill="black" stroke="none"
              text-anchor="middle" font-size="${fontSize * 1.2}" font-family="Arial" font-weight="bold">${stars}</text>
    </g>`;
}

function displayStats(timeLabels, groupConfigs) {
    const nGroups = groupConfigs.length;
    const mainHeader = nGroups === 2 ? "Welch's t (p)" : "ANOVA (p)";

    let html = `<table style="width:100%; border-collapse: collapse; font-size: 0.85rem;">
        <thead>
            <tr style="background:#f1f3f5; border-bottom:2px solid #dee2e6;">
                <th style="padding:10px;">Time Point</th>
                <th style="padding:10px;">${mainHeader}</th>
                <th style="padding:10px;">${nGroups === 2 ? 'Brunner-Munzel (p)' : 'Dunnett (Post-hoc)'}</th>
                <th style="padding:10px;">Significance</th>
            </tr>
        </thead>
        <tbody>`;

    timeLabels.forEach((label, tIdx) => {
        const filteredGroups = groupConfigs.filter(g => (g.data[tIdx] || []).length > 1);
        const groupsData = filteredGroups.map(g => g.data[tIdx]);
        if (groupsData.length < 2) return;

        let pMain = 1;
        let postHocHtml = "-";
        let status = "NS";

        if (nGroups === 2) {
            const res = welchTTest(groupsData[0], groupsData[1]);
            const bm = brunnerMunzel(groupsData[0], groupsData[1]);
            pMain = res ? res.p : 1;
            postHocHtml = bm ? bm.p.toFixed(4) : "-";
            status = pMain < 0.05 ? "Significant" : "NS";
        } else {
            const aRes = oneWayANOVA(groupsData);
            if (aRes) {
                pMain = fDistributionP(aRes.f, aRes.df1, aRes.df2);
                const dunnettRes = runDunnett(groupsData, aRes.msWithin, aRes.df2);
                postHocHtml = dunnettRes.map((r, idx) =>
                    `<div style="color:${r.isSig ? 'red' : '#666'}">${filteredGroups[idx + 1].name}: p=${r.p.toFixed(4)}</div>`
                ).join("");
                status = pMain < 0.05 ? "Significant" : "NS";
            }
        }

        html += `<tr style="border-bottom:1px solid #eee;">
            <td style="padding:8px; font-weight:bold;">${label}</td>
            <td style="padding:8px; color:${pMain < 0.05 ? 'red' : 'black'}">${pMain.toFixed(4)}</td>
            <td style="padding:8px; font-size:0.75rem;">${postHocHtml}</td>
            <td style="padding:8px;"><strong>${status}</strong></td>
        </tr>`;
    });

    html += `</tbody></table>`;
    document.getElementById('statsTableContainer').innerHTML = html;
}

function updatePlot() {
    const isCompMode = document.getElementById('comparisonMode').checked;
    const timeLabels = isCompMode ? ["Data"] : document.getElementById('timePointsInput').value.trim().split(/[\t\s]+/).filter(s => s !== "");
    if (timeLabels.length === 0) return;

    const fsX = parseInt(document.getElementById('fontSizeX').value);
    const fsY = parseInt(document.getElementById('fontSizeY').value);
    const numTicks = parseInt(document.getElementById('numTicks').value);
    const width = parseInt(document.getElementById('chartWidth').value);
    const height = parseInt(document.getElementById('chartHeight').value);
    const yMaxManual = parseFloat(document.getElementById('yMaxInput').value);
    const autoBrackets = document.getElementById('autoBrackets').checked;

    const groupCards = document.querySelectorAll('.group-card');
    const groupConfigs = Array.from(groupCards).map(card => ({
        name: card.querySelector('.group-name-input').value,
        color: card.querySelector('.group-color-input').value,
        data: parseData(card.querySelector('.group-data-input').value, timeLabels.length)
    }));
    const nGroups = groupConfigs.length;

    let maxBracketLayers = 0;
    timeLabels.forEach((_, tIdx) => {
        const d = groupConfigs.map(g => g.data[tIdx]).filter(x => x.length > 1);
        if (d.length === 2) {
            const res = welchTTest(d[0], d[1]);
            if (res && res.p < 0.05) maxBracketLayers = Math.max(maxBracketLayers, 1);
        } else if (d.length >= 3) {
            const a = oneWayANOVA(d);
            if (a && fDistributionP(a.f, a.df1, a.df2) < 0.05) {
                const sigCount = runDunnett(d, a.msWithin, a.df2).filter(r => r.isSig).length;
                maxBracketLayers = Math.max(maxBracketLayers, sigCount);
            }
        }
    });

    const allValues = groupConfigs.flatMap(g => g.data.flat());
    const statsAll = groupConfigs.flatMap(g => g.data.map(calcStats));
    const rawMax = Math.max(...allValues, ...statsAll.map(s => s.mean + s.se), 1);

    let yMax = yMaxManual > 0 ? yMaxManual : Math.ceil(rawMax * 1.1 / 10) * 10;
    if (autoBrackets && maxBracketLayers > 0 && yMaxManual === 0) {
        const extraSpace = 1.1 + (maxBracketLayers * 0.15);
        yMax = Math.ceil((rawMax * extraSpace) / 10) * 10;
    }

    const pL = fsY * 4, pB = fsX * 3, pT = 30, pR = 30;
    const graphW = width - pL - pR, graphH = height - pB - pT;
    const yScale = (v) => height - pB - (v / yMax * graphH);

    let svgItems = [];
    const strokeW = 1.2;

    function groupX(idx, tIdx) {
        if (isCompMode) return pL + (idx + 0.5) * (graphW / nGroups);
        const xCenter = pL + (tIdx + 0.5) * (graphW / timeLabels.length);
        const groupSpace = (graphW / timeLabels.length) * 0.85;
        return xCenter + (idx - (nGroups - 1) / 2) * (groupSpace / nGroups);
    }

    function drawGroupContent(x, data, s, group) {
        const yM = yScale(s.mean), yT = yScale(s.mean + s.se), yB = yScale(s.mean - s.se);
        const dotR = parseFloat(document.getElementById('dotSize').value);
        const jitter = parseFloat(document.getElementById('jitter').value);

        svgItems.push(`
    <g stroke="black" stroke-width="1.2">
        <line x1="${x}" y1="${yB}" x2="${x}" y2="${yT}" />
        <line x1="${x-5}" y1="${yT}" x2="${x+5}" y2="${yT}" />
        <line x1="${x-5}" y1="${yB}" x2="${x+5}" y2="${yB}" />
        <line x1="${x-12}" y1="${yM}" x2="${x+12}" y2="${yM}" stroke-width="3" />
    </g>`);
        data.forEach(v => {
            const j = (Math.random() - 0.5) * jitter;
            svgItems.push(`<circle cx="${x + j}" cy="${yScale(v)}" r="${dotR}" fill="${group.color}" stroke="black" stroke-width="0.8" />`);
        });
    }

    svgItems.push(`<line x1="${pL}" y1="${height-pB}" x2="${pL}" y2="${pT}" stroke="black" stroke-width="${strokeW}"/>`);
    svgItems.push(`<line x1="${pL}" y1="${height-pB}" x2="${width-pR}" y2="${height-pB}" stroke="black" stroke-width="${strokeW}"/>`);

    for (let i = 0; i <= numTicks; i++) {
        const val = Number((yMax / numTicks * i).toFixed(1));
        const y = yScale(val);
        svgItems.push(`<line x1="${pL}" y1="${y}" x2="${pL-5}" y2="${y}" stroke="black" stroke-width="${strokeW}"/>`);
        svgItems.push(`<text x="${pL-8}" y="${y}" text-anchor="end" dominant-baseline="central" font-size="${fsY}" font-family="Arial">${val}</text>`);
    }

    if (isCompMode) {
        groupConfigs.forEach((group, gIdx) => {
            const x = groupX(gIdx, 0);
            const data = group.data[0] || [];
            const s = calcStats(data);
            if (s.n > 0) drawGroupContent(x, data, s, group);
            svgItems.push(`<text x="${x}" y="${height-pB+fsX+10}" text-anchor="middle" font-size="${fsX}" font-family="Arial" font-weight="bold">${group.name}</text>`);
        });
    } else {
        timeLabels.forEach((label, tIdx) => {
            groupConfigs.forEach((group, gIdx) => {
                const x = groupX(gIdx, tIdx);
                const data = group.data[tIdx] || [];
                const s = calcStats(data);
                if (s.n > 0) drawGroupContent(x, data, s, group);
            });
            const xCenter = pL + (tIdx + 0.5) * (graphW / timeLabels.length);
            svgItems.push(`<text x="${xCenter}" y="${height-pB+fsX+10}" text-anchor="middle" font-size="${fsX}" font-family="Arial" font-weight="bold">${label}</text>`);
        });
    }

    if (autoBrackets) {
        timeLabels.forEach((label, tIdx) => {
            const filteredGroups = groupConfigs.map((g, idx) => ({ ...g, idx })).filter(g => (g.data[tIdx] || []).length > 1);
            const groupsData = filteredGroups.map(g => g.data[tIdx]);
            if (groupsData.length < 2) return;

            const statsAtTime = groupsData.map(calcStats);
            const errorMaxY = Math.min(...statsAtTime.map(s => yScale(s.mean + s.se)));
            let bracketY = errorMaxY - 15;

            const ctrlX = groupX(filteredGroups[0].idx, tIdx);

            if (groupsData.length === 2) {
                const res = welchTTest(groupsData[0], groupsData[1]);
                if (res && res.p < 0.05) {
                    const targetX = groupX(filteredGroups[1].idx, tIdx);
                    svgItems.push(drawBracket(ctrlX, targetX, bracketY, getStars(res.p), fsX));
                }
            } else {
                const a = oneWayANOVA(groupsData);
                if (a && fDistributionP(a.f, a.df1, a.df2) < 0.05) {
                    const dunnettRes = runDunnett(groupsData, a.msWithin, a.df2);
                    dunnettRes.forEach((res, i) => {
                        if (res.isSig) {
                            const target = filteredGroups[i + 1];
                            if (!target) return;
                            const targetX = groupX(target.idx, tIdx);
                            svgItems.push(drawBracket(ctrlX, targetX, bracketY, getStars(res.p), fsX));
                            bracketY -= 22;
                        }
                    });
                }
            }
        });
    }

    if (document.getElementById('showLegend').checked) {
        const lx = pL + graphW * 0.85;
        const ly = pT + fsY * 1.2;
        groupConfigs.forEach((group, i) => {
            const itemY = ly + (i * fsY * 1.5);
            svgItems.push(`
        <g id="Legend_${group.name}" font-family="Arial" font-size="${fsY}">
            <circle cx="${lx}" cy="${itemY}" r="${parseFloat(document.getElementById('dotSize').value)}" fill="${group.color}" stroke="black" stroke-width="${strokeW * 0.8}" />
            <text x="${lx + fsY}" y="${itemY}" dominant-baseline="central" fill="black">${group.name}</text>
        </g>`);
        });
    }

    document.getElementById('svg-container').innerHTML = `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg" style="background:white;">${svgItems.join('')}</svg>`;
    displayStats(timeLabels, groupConfigs);
}

function downloadSVG() {
    const svg = document.getElementById('svg-container').innerHTML;
    const blob = new Blob([svg], {type: "image/svg+xml"});
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `MultiGroup_Figure_${new Date().getTime()}.svg`;
    link.click();
}

const resizer = document.getElementById("resizerHandle");
const leftPanel = document.getElementById("leftPanel");

resizer.addEventListener("mousedown", function(e) {
    e.preventDefault();
    document.addEventListener("mousemove", resize);
    document.addEventListener("mouseup", stopResize);
    resizer.style.background = "#007bff";
});

function resize(e) {
    if (e.clientX > 200 && e.clientX < 600) {
        leftPanel.style.flex = `0 0 ${e.clientX}px`;
    }
}

function stopResize() {
    document.removeEventListener("mousemove", resize);
    resizer.style.background = "";
}

addNewGroup("KO", "#ffcccc", "80\t150\t200\n70\t140\t220");
