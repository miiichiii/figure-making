<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>SVG Plotter v10 - Multi-Group Support</title>
    <style>
        body { font-family: -apple-system, sans-serif; margin: 20px; background: #f8f9fa; color: #333; }
        .container {
            display: flex;
            gap: 0;
            max-width: 100vw;
            height: 98vh;
            margin: 0 auto;
            align-items: flex-start;
        }
        .panel { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .input-area {
            flex: 0 0 420px;
            min-width: 250px;
            max-width: 800px;
            position: sticky;
            top: 10px;
            max-height: 95vh;
            overflow-y: auto;
        }

        .preview-wrapper {
            display: grid; grid-template-columns: 50px 1fr; grid-template-rows: 1fr 50px;
            gap: 10px; background: #fafafa; padding: 30px; border: 2px dashed #ddd; border-radius: 12px;
            align-items: center; justify-items: center;
        }
        .slider-v { grid-column: 1; grid-row: 1; appearance: slider-vertical; width: 12px; height: 400px; }
        .slider-h { grid-column: 2; grid-row: 2; width: 500px; height: 12px; }
        #svg-wrapper { grid-column: 2; grid-row: 1; background: white; box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
        .preview-wrapper { flex: 1; }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 20px;
            height: 100vh;
            overflow-y: auto;
        }
        .stats-panel { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .code-board { background: #282c34; color: #abb2bf; padding: 15px; border-radius: 8px; font-family: "SF Mono", monospace; font-size: 11px; overflow-x: auto; white-space: pre; }

        .resizer {
            width: 8px;
            cursor: col-resize;
            background: #e0e0e0;
            transition: background 0.2s;
            z-index: 10;
            height: 100%;
            align-self: stretch;
        }
        .resizer:hover { background: #007bff; }

        /* グループカード関連 */
        .group-card { border: 1px solid #e0e0e0; padding: 12px; border-radius: 8px; margin-bottom: 15px; position: relative; background: #fff; }
        .group-header { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; padding-right: 30px; }
        .btn-remove { position: absolute; top: 8px; right: 8px; background: #ff4444; color: white; border: none; border-radius: 4px; width: 24px; height: 24px; cursor: pointer; font-size: 12px; }
        textarea { width: 100%; height: 70px; font-family: "SF Mono", monospace; font-size: 11px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }

        .master-label-card { background: #eef6ff; border: 1px solid #b6d4fe; padding: 12px; border-radius: 8px; margin-bottom: 15px; }
        .control-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; font-size: 0.85rem; }
        label { font-weight: bold; color: #555; display: block; margin-bottom: 3px; }
        input[type="number"], input[type="range"], select, .text-input { width: 100%; padding: 6px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }

        button { width: 100%; padding: 12px; margin-top: 10px; cursor: pointer; border: none; border-radius: 6px; font-weight: bold; }
        .btn-add { background: #6c757d; color: white; margin-bottom: 20px; }
        .btn-gen { background: #007bff; color: white; }
        .btn-dl { background: #28a745; color: white; }
    </style>
</head>
<body>

<div class="container">
    <div class="panel input-area" id="leftPanel">
        <h3 style="margin-top:0;">1. Time Points / Labels</h3>
        <div class="master-label-card">
            <label>Shared X-Labels (Space separated)</label>
            <input type="text" id="timePointsInput" class="text-input" value="Day1 Day3 Day7" oninput="updatePlot()">
        </div>

        <h3>2. Group Data</h3>
        <div id="groupsContainer">
            </div>
        <button class="btn-add" onclick="addNewGroup()">+ Add New Group</button>

        <div class="control-grid">
            <div><label>Font (X)</label><input type="number" id="fontSizeX" value="14" oninput="updatePlot()"></div>
            <div><label>Font (Y)</label><input type="number" id="fontSizeY" value="14" oninput="updatePlot()"></div>
            <div><label>Dot Size</label><input type="range" id="dotSize" min="1" max="15" value="4" oninput="updatePlot()"></div>
            <div><label>Dot Jitter</label><input type="range" id="jitter" min="0" max="40" value="15" oninput="updatePlot()"></div>
            <div><label>Y-Max (0=Auto)</label><input type="number" id="yMaxInput" value="0" oninput="updatePlot()"></div>
            <div><label>Ticks</label><input type="number" id="numTicks" value="5" oninput="updatePlot()"></div>
        </div>
        <div class="control-grid" style="border-top: 1px solid #eee; padding-top: 10px;">
            <div style="grid-column: span 2;">
                <label><input type="checkbox" id="showLegend" checked onchange="updatePlot()"> Show Legend (凡例表示)</label>
            </div>
            <div>
                <label>Legend X (%)</label>
                <input type="number" id="legendX" value="85" oninput="updatePlot()">
            </div>
            <div>
                <label>Legend Y (%)</label>
                <input type="number" id="legendY" value="10" oninput="updatePlot()">
            </div>
        </div>
        <div style="margin-top: 10px; padding: 10px; background: #f0f4f8; border-radius: 6px;">
            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: bold;">
                <input type="checkbox" id="showPostHoc" onchange="updatePlot()">
                Show Post-hoc Analysis (Dunnett)
            </label>
            <small style="color: #666; display: block; margin-top: 4px;">※ 第1グループをControlとして各群と比較します</small>
        </div>
        <div style="margin-top: 10px; padding: 10px; background: #fff0f6; border-radius: 6px; border: 1px solid #ffdeeb;">
            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: bold; color: #d6336c;">
                <input type="checkbox" id="autoBrackets" onchange="updatePlot()" checked>
                Auto Plot Significance (*)
            </label>
            <small style="color: #666; display: block; margin-top: 4px;">※ Dunnett検定で有意な箇所に自動描画します</small>
        </div>

        <button class="btn-gen" onclick="updatePlot()">Refresh Preview</button>
        <button class="btn-dl" onclick="downloadSVG()">Download SVG</button>
    </div>

    <div class="resizer" id="resizerHandle"></div>

    <div class="main-content">
        <div class="preview-wrapper">
            <input type="range" class="slider-v" id="chartHeight" min="200" max="800" value="400" oninput="updatePlot()">
            <div id="svg-wrapper"><div id="svg-container"></div></div>
            <input type="range" class="slider-h" id="chartWidth" min="300" max="1000" value="600" oninput="updatePlot()">
        </div>

        <div class="stats-panel">
            <h3>3. Statistical Analysis Board</h3>
            <div id="statsTableContainer">
                <p style="color: #666;">データを入力すると、各タイムポイントごとの検定結果がここに表示されます。</p>
            </div>
        </div>

        <div class="stats-panel">
            <h3>4. Statistical Methods & Source Code</h3>
            <div class="code-board" id="codeDisplay">// 統計アルゴリズムを表示中...</div>
        </div>
    </div>
</div>

<script>
let groupCount = 0;
const defaultColors = ['#ffffff', '#ffcccc', '#ccffcc', '#ccccff', '#ffffcc', '#ffccff'];

function addNewGroup(name = "", color = "", data = "") {
    groupCount++;
    const id = `group_${groupCount}`;
    const container = document.getElementById('groupsContainer');
    const colorVal = color || defaultColors[(groupCount - 1) % defaultColors.length];
    const nameVal = name || (groupCount === 1 ? "WT" : groupCount === 2 ? "KO" : `Drug ${groupCount - 2}`);

    const card = document.createElement('div');
    card.className = 'group-card';
    card.id = id;
    card.innerHTML = `
        <button class="btn-remove" onclick="removeGroup('${id}')">×</button>
        <div class="group-header">
            <input type="text" class="group-name-input" value="${nameVal}" style="width:100px" oninput="updatePlot()">
            <input type="color" class="group-color-input" value="${colorVal}" oninput="updatePlot()">
        </div>
        <textarea class="group-data-input" placeholder="Paste data here..." oninput="handlePaste('${id}')">${data}</textarea>
    `;
    container.appendChild(card);
    updatePlot();
}

function removeGroup(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
    updatePlot();
}

function handlePaste(id) {
    const card = document.getElementById(id);
    const textarea = card.querySelector('.group-data-input');
    const text = textarea.value.trim();
    if (!text) return;

    const lines = text.split('\n');
    const firstLine = lines[0].split('\t');
    const isHeader = firstLine.some(cell => isNaN(parseFloat(cell)) && cell !== "");

    // 最初のグループかつヘッダーがある場合のみ、マスターラベルを更新
    if (isHeader && id === document.querySelector('.group-card').id) {
        document.getElementById('timePointsInput').value = firstLine.join(' ');
    }
    updatePlot();
}

function parseData(text, expectedCount) {
    const lines = text.trim().split('\n');
    if (lines.length === 0 || text === "") return [];

    let startIdx = 0;
    const firstLineCells = lines[0].split('\t');
    if (firstLineCells.some(cell => isNaN(parseFloat(cell)) && cell !== "")) {
        startIdx = 1;
    }

    const result = Array.from({ length: expectedCount }, () => []);
    for (let i = startIdx; i < lines.length; i++) {
        const values = lines[i].split('\t');
        for (let j = 0; j < expectedCount; j++) {
            if (values[j] !== undefined && values[j].trim() !== "" && !isNaN(values[j])) {
                result[j].push(parseFloat(values[j]));
            }
        }
    }
    return result;
}

function calcStats(arr) {
    const n = arr.length;
    if (n === 0) return { mean: 0, sd: 0, se: 0, n: 0 };
    const mean = arr.reduce((a, b) => a + b, 0) / n;
    const variance = n > 1 ? arr.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / (n - 1) : 0;
    const sd = Math.sqrt(variance);
    return { mean, sd, se: sd / Math.sqrt(n), n };
}

// --- 統計計算ユーティリティ ---

// 1. Welch's t-test (2群の平均値の比較)
function welchTTest(a, b) {
    const s1 = calcStats(a), s2 = calcStats(b);
    if (s1.n < 2 || s2.n < 2) return null;
    const v1 = Math.pow(s1.sd, 2), v2 = Math.pow(s2.sd, 2);
    const t = Math.abs(s1.mean - s2.mean) / Math.sqrt(v1 / s1.n + v2 / s2.n);
    const df = Math.pow(v1 / s1.n + v2 / s2.n, 2) / (Math.pow(v1 / s1.n, 2) / (s1.n - 1) + Math.pow(v2 / s2.n, 2) / (s2.n - 1));
    // p-value 近似 (正規分布近似)
    const p = 2 * (1 - normalCDF(Math.abs(t)));
    return { t, p, df, method: "Welch's t-test" };
}

// 2. One-way ANOVA (3群以上の比較)
function oneWayANOVA(groupsData) {
    const validGroups = groupsData.filter(g => g.length > 1);
    if (validGroups.length < 3) return null;

    const allData = validGroups.flat();
    const grandMean = allData.reduce((a, b) => a + b, 0) / allData.length;

    let ssBetween = 0, ssWithin = 0;
    validGroups.forEach(group => {
        const m = group.reduce((a, b) => a + b, 0) / group.length;
        ssBetween += group.length * Math.pow(m - grandMean, 2);
        group.forEach(v => { ssWithin += Math.pow(v - m, 2); });
    });

    const dfBetween = validGroups.length - 1;
    const dfWithin = allData.length - validGroups.length;
    const msBetween = ssBetween / dfBetween;
    const msWithin = ssWithin / dfWithin;
    const f = msBetween / msWithin;

    return { f, df1: dfBetween, df2: dfWithin, msWithin, method: "One-way ANOVA" };
}

// 3. Brunner-Munzel Test (非パラメトリック)
function brunnerMunzel(x, y) {
    const n1 = x.length, n2 = y.length;
    if (n1 < 2 || n2 < 2) return { p: 1.0, w: 0 };

    // 1. 共通ランク R の計算
    const combined = [...x.map(v => ({ v, g: 1 })), ...y.map(v => ({ v, g: 2 }))].sort((a, b) => a.v - b.v);
    combined.forEach((d, i) => d.r = i + 1); // 簡易ランク（タイ調整なし）

    const r1 = combined.filter(d => d.g === 1).map(d => d.r);
    const r2 = combined.filter(d => d.g === 2).map(d => d.r);

    // 2. 内部ランク S の計算
    const s1 = x.slice().sort((a, b) => a - b).map((v, i) => i + 1);
    const s2 = y.slice().sort((a, b) => a - b).map((v, i) => i + 1);

    const m1 = r1.reduce((a, b) => a + b, 0) / n1;
    const m2 = r2.reduce((a, b) => a + b, 0) / n2;

    // 3. 不偏分散の推定
    const v1 = r1.reduce((sum, ri, i) => sum + Math.pow(ri - s1[i] - m1 + (n1 + 1) / 2, 2), 0) / (n1 - 1);
    const v2 = r2.reduce((sum, rj, i) => sum + Math.pow(rj - s2[i] - m2 + (n2 + 1) / 2, 2), 0) / (n2 - 1);

    // 4. 統計量 W の算出
    const w = (n1 * n2 * (m2 - m1)) / ((n1 + n2) * Math.sqrt(n1 * v1 + n2 * v2));

    // 5. 自由度 df の推定
    const df = Math.pow(n1 * v1 + n2 * v2, 2) / (Math.pow(n1 * v1, 2) / (n1 - 1) + Math.pow(n2 * v2, 2) / (n2 - 1));

    // 6. P値の算出 (正規分布近似 - サンプルサイズが小さくない前提)
    const p = 2 * (1 - normalCDF(Math.abs(w)));
    return { p, w, df };
}

// 標準正規分布の累積分布関数 (p値算出用)
function normalCDF(x) {
    const t = 1 / (1 + 0.2316419 * Math.abs(x));
    const d = 0.3989423 * Math.exp(-x * x / 2);
    const p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + 1.330274 * t))));
    return x > 0 ? 1 - p : p;
}

// 正則不完全ベータ関数の近似ロジック（統計関数で共通利用）
function ibeta(x, a, b) {
    let bt = (x > 0 && x < 1) ? Math.exp(logGamma(a + b) - logGamma(a) - logGamma(b) + a * Math.log(x) + b * Math.log(1 - x)) : 0;
    if (x < (a + 1) / (a + b + 2)) return bt * betacf(x, a, b) / a;
    return 1 - bt * betacf(1 - x, b, a) / b;
}
function logGamma(z) {
    const c = [76.18009172947146, -86.50532032941677, 24.01409824083091, -1.231739572450155, 0.1208650973866179e-2, -0.5395239384953e-5];
    let x = y = z, tmp = x + 5.5;
    tmp -= (x + 0.5) * Math.log(tmp);
    let ser = 1.000000000190015;
    for (let i = 0; i < 6; i++) ser += c[i] / ++y;
    return -tmp + Math.log(2.5066282746310005 * ser / x);
}
function betacf(x, a, b) {
    let qab = a + b, qap = a + 1, qam = a - 1, c = 1, d = 1 - qab * x / qap;
    if (Math.abs(d) < 1e-10) d = 1e-10;
    d = 1 / d;
    let h = d;
    for (let m = 1; m <= 100; m++) {
        let m2 = 2 * m, aa = m * (b - m) * x / ((qam + m2) * (a + m2));
        d = 1 + aa * d; if (Math.abs(d) < 1e-10) d = 1e-10;
        c = 1 + aa / c; if (Math.abs(c) < 1e-10) c = 1e-10;
        d = 1 / d; h *= d * c;
        aa = -(a + m) * (qab + m) * x / ((a + m2) * (qap + m2));
        d = 1 + aa * d; if (Math.abs(d) < 1e-10) d = 1e-10;
        c = 1 + aa / c; if (Math.abs(c) < 1e-10) c = 1e-10;
        d = 1 / d; h *= d * c;
        if (Math.abs(h - 1) < 1e-7) break;
    }
    return h;
}

// --- 追加：F分布からP値を算出する関数（ANOVA用） ---
function fDistributionP(F, df1, df2) {
    if (F <= 0) return 1.0;
    // 簡易的な不完全ベータ関数による近似（Vanilla JSでの実装）
    const x = df2 / (df2 + df1 * F);
    const a = df2 / 2;
    const b = df1 / 2;

    return ibeta(x, a, b);
}

// --- Dunnett's Test 簡易実装 (Control vs Others) ---
function runDunnett(groupsData, msWithin, dfWithin) {
    const control = groupsData[0];
    const results = [];
    const n1 = control.length;
    const mean1 = control.reduce((a, b) => a + b, 0) / n1;

    for (let i = 1; i < groupsData.length; i++) {
        const treat = groupsData[i];
        const n2 = treat.length;
        const mean2 = treat.reduce((a, b) => a + b, 0) / n2;

        // 標準誤差 (ANOVAのMSwithinを使用)
        const se = Math.sqrt(msWithin * (1 / n1 + 1 / n2));
        const tVal = Math.abs(mean1 - mean2) / se;

        // P値の近似 (Bonferroni調整を加えたt分布近似)
        const k = groupsData.length - 1;
        const rawP = 2 * (1 - studentTCDF(tVal, dfWithin));
        const adjustedP = Math.min(1.0, rawP * k);

        results.push({
            targetName: `Group ${i + 1}`,
            p: adjustedP,
            isSig: adjustedP < 0.05
        });
    }
    return results;
}

// 自由度dfのt分布累積分布関数 (簡易近似)
function studentTCDF(t, df) {
    const x = df / (df + t * t);
    return 1 - 0.5 * ibeta(x, df / 2, 0.5);
}

// P値に応じたアスタリスクを返す
function getStars(p) {
    if (p < 0.001) return "***";
    if (p < 0.01) return "**";
    if (p < 0.05) return "*";
    return "";
}

// ブラケット描画用の関数
function drawBracket(x1, x2, y, stars, fontSize) {
    const tickH = 6; // カギ線の端の長さ
    return `
    <g class="sig-bracket" stroke="black" fill="none" stroke-width="1.2">
        <path d="M ${x1} ${y} L ${x1} ${y - tickH} L ${x2} ${y - tickH} L ${x2} ${y}" />
        <text x="${(x1 + x2) / 2}" y="${y - tickH - 2}" fill="black" stroke="none"
              text-anchor="middle" font-size="${fontSize * 1.2}" font-family="Arial" font-weight="bold">${stars}</text>
    </g>`;
}

function updateCodeDisplay() {
    const code = `// --- Analysis Logic Used ---
// 1. Welch's T-Test: assumes unequal variance.
// 2. Brunner-Munzel: robust non-parametric test.

${brunnerMunzel.toString()}

${welchTTest.toString()}`;
    document.getElementById('codeDisplay').textContent = code;
}

function displayStats(timeLabels, groupConfigs) {
    const nGroups = groupConfigs.length;
    const showPostHoc = document.getElementById('showPostHoc').checked;

    let html = `<table style="width:100%; border-collapse: collapse; font-size: 0.85rem; text-align: left;">
        <thead>
            <tr style="background:#f1f3f5; border-bottom:2px solid #dee2e6;">
                <th style="padding:10px;">Time Point</th>
                <th style="padding:10px;">Global Test (p)</th>
                ${showPostHoc && nGroups >= 3 ? '<th style="padding:10px;">Post-hoc (Dunnett vs Ctrl)</th>' : ''}
                <th style="padding:10px;">Status</th>
            </tr>
        </thead>
        <tbody>`;

    timeLabels.forEach((label, tIdx) => {
        const filteredGroups = groupConfigs.filter(g => (g.data[tIdx] || []).length > 1);
        const groupsData = filteredGroups.map(g => g.data[tIdx]);
        if (groupsData.length < 2) return;

        let pMain = 1;
        let postHocHtml = "";
        let status = "NS";

        if (nGroups === 2) {
            const res = welchTTest(groupsData[0], groupsData[1]);
            pMain = res ? res.p : 1;
            status = pMain < 0.05 ? "Significant" : "NS";
        } else {
            const aRes = oneWayANOVA(groupsData);
            if (aRes) {
                pMain = fDistributionP(aRes.f, aRes.df1, aRes.df2);
                if (showPostHoc) {
                    const dunnettRes = runDunnett(groupsData, aRes.msWithin, aRes.df2);
                    postHocHtml = dunnettRes.map((r, idx) =>
                        `<div style="color:${r.isSig ? 'red' : '#666'}">${filteredGroups[idx + 1].name}: p=${r.p.toFixed(4)}</div>`
                    ).join("");
                }
                status = pMain < 0.05 ? "Significant" : "NS";
            }
        }

        html += `<tr style="border-bottom:1px solid #eee;">
            <td style="padding:8px; font-weight:bold;">${label}</td>
            <td style="padding:8px; color:${pMain < 0.05 ? 'red' : 'black'}">${pMain.toFixed(4)}</td>
            ${showPostHoc && nGroups >= 3 ? `<td style="padding:8px; font-size:0.75rem;">${postHocHtml}</td>` : ''}
            <td style="padding:8px;"><strong>${status}</strong></td>
        </tr>`;
    });

    html += `</tbody></table>`;
    document.getElementById('statsTableContainer').innerHTML = html;
    updateCodeDisplay();
}

function updatePlot() {
    const timeLabels = document.getElementById('timePointsInput').value.trim().split(/[\t\s]+/).filter(s => s !== "");
    if (timeLabels.length === 0) return;

    const fsX = parseInt(document.getElementById('fontSizeX').value);
    const fsY = parseInt(document.getElementById('fontSizeY').value);
    const dotR = parseFloat(document.getElementById('dotSize').value);
    const numTicks = parseInt(document.getElementById('numTicks').value);
    const width = parseInt(document.getElementById('chartWidth').value);
    const height = parseInt(document.getElementById('chartHeight').value);
    const yMaxManual = parseFloat(document.getElementById('yMaxInput').value);
    const jitterAmount = parseFloat(document.getElementById('jitter').value);

    // 全グループデータの取得
    const groupCards = document.querySelectorAll('.group-card');
    const groupConfigs = Array.from(groupCards).map(card => ({
        name: card.querySelector('.group-name-input').value,
        color: card.querySelector('.group-color-input').value,
        data: parseData(card.querySelector('.group-data-input').value, timeLabels.length)
    }));
    const nGroups = groupConfigs.length;

    const allValues = groupConfigs.flatMap(g => g.data.flat());
    const statsAll = groupConfigs.flatMap(g => g.data.map(calcStats));
    const maxVal = Math.max(...allValues, ...statsAll.map(s => s.mean + s.se), 1);
    const yMax = yMaxManual > 0 ? yMaxManual : Math.ceil(maxVal / 10) * 10;

    const pL = fsY * 4, pB = fsX * 3, pT = 30, pR = 30;
    const graphW = width - pL - pR, graphH = height - pB - pT;
    const yScale = (v) => height - pB - (v / yMax * graphH);

    let svgItems = [];
    const strokeW = 1.2;

    // 軸
    svgItems.push(`<line x1="${pL}" y1="${height-pB}" x2="${pL}" y2="${pT}" stroke="black" stroke-width="${strokeW}"/>`);
    svgItems.push(`<line x1="${pL}" y1="${height-pB}" x2="${width-pR}" y2="${height-pB}" stroke="black" stroke-width="${strokeW}"/>`);

    // Y軸目盛り
    for(let i=0; i<=numTicks; i++){
        const val = Number((yMax / numTicks * i).toFixed(1));
        const y = yScale(val);
        svgItems.push(`<line x1="${pL}" y1="${y}" x2="${pL-5}" y2="${y}" stroke="black" stroke-width="${strokeW}"/>`);
        svgItems.push(`<text x="${pL-8}" y="${y}" text-anchor="end" dominant-baseline="central" font-size="${fsY}" font-family="Arial">${val}</text>`);
    }

    // 各タイムポイントの描画
    timeLabels.forEach((label, tIdx) => {
        const xCenter = pL + (tIdx + 0.5) * (graphW / timeLabels.length);
        const groupSpace = (graphW / timeLabels.length) * 0.85;

        groupConfigs.forEach((group, gIdx) => {
            const xOffset = (gIdx - (groupConfigs.length - 1) / 2) * (groupSpace / groupConfigs.length);
            const x = xCenter + xOffset;
            const data = group.data[tIdx] || [];
            const s = calcStats(data);

            if (s.n > 0) {
                const yM = yScale(s.mean), yT = yScale(s.mean+s.se), yB = yScale(s.mean-s.se);
                svgItems.push(`
                <g id="${group.name}_${label}" stroke="black" stroke-width="${strokeW}">
                    <line x1="${x}" y1="${yB}" x2="${x}" y2="${yT}" />
                    <line x1="${x-4}" y1="${yT}" x2="${x+4}" y2="${yT}" />
                    <line x1="${x-4}" y1="${yB}" x2="${x+4}" y2="${yB}" />
                    <line x1="${x-8}" y1="${yM}" x2="${x+8}" y2="${yM}" stroke-width="${strokeW*2.5}" />
                </g>`);
                data.forEach(v => {
                    const jitter = (Math.random()-0.5) * jitterAmount;
                    svgItems.push(`<circle cx="${x+jitter}" cy="${yScale(v)}" r="${dotR}" fill="${group.color}" stroke="black" stroke-width="${strokeW*0.8}" />`);
                });
            }
        });
        svgItems.push(`<text x="${xCenter}" y="${height-pB+fsX+10}" text-anchor="middle" font-size="${fsX}" font-family="Arial" font-weight="bold">${label}</text>`);
    });

    // --- 有意差ブラケットの自動描画ロジック ---
    if (document.getElementById('autoBrackets').checked && nGroups >= 3) {
        timeLabels.forEach((label, tIdx) => {
            const groupsData = groupConfigs.map(g => g.data[tIdx]).filter(d => d.length > 1);
            if (groupsData.length < 3) return;

            const aRes = oneWayANOVA(groupsData);
            if (aRes && fDistributionP(aRes.f, aRes.df1, aRes.df2) < 0.05) {
                const dunnettRes = runDunnett(groupsData, aRes.msWithin, aRes.df2);

                // 各群の最大Y座標を取得（配置の基準にする）
                const xCenter = pL + (tIdx + 0.5) * (graphW / timeLabels.length);
                const groupSpace = (graphW / timeLabels.length) * 0.85;
                const ctrlX = xCenter + (0 - (nGroups - 1) / 2) * (groupSpace / nGroups);

                // タイムポイント内の全データの最大高さを取得
                const statsAtTime = groupsData.map(calcStats);
                const errorMax = Math.min(...statsAtTime.map(s => yScale(s.mean + s.se)));

                let bracketY = errorMax - 15; // 最初のブラケットの高さ

                dunnettRes.forEach((res, i) => {
                    if (res.isSig) {
                        const targetIdx = i + 1; // Controlが0番目なので
                        const targetX = xCenter + (targetIdx - (nGroups - 1) / 2) * (groupSpace / nGroups);
                        const stars = getStars(res.p);

                        svgItems.push(drawBracket(ctrlX, targetX, bracketY, stars, fsX));
                        bracketY -= 20; // 次のブラケットを上にずらす
                    }
                });
            }
        });
    }

    // --- Legend Generation ---
    if (document.getElementById('showLegend').checked) {
        const lxPercent = parseFloat(document.getElementById('legendX').value) / 100;
        const lyPercent = parseFloat(document.getElementById('legendY').value) / 100;
        const lx = pL + (graphW * lxPercent);
        const ly = pT + (graphH * lyPercent);

        groupConfigs.forEach((group, i) => {
            const itemY = ly + (i * fsY * 1.5);
            svgItems.push(`
        <g id="Legend_${group.name}" font-family="Arial" font-size="${fsY}">
            <circle cx="${lx}" cy="${itemY}" r="${dotR}" fill="${group.color}" stroke="black" stroke-width="${strokeW * 0.8}" />
            <text x="${lx + fsY}" y="${itemY}" dominant-baseline="central" fill="black">${group.name}</text>
        </g>`);
        });
    }

    document.getElementById('svg-container').innerHTML = `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg" style="background:white;">${svgItems.join('')}</svg>`;
    displayStats(timeLabels, groupConfigs);
}

function downloadSVG() {
    const svg = document.getElementById('svg-container').innerHTML;
    const blob = new Blob([svg], {type: "image/svg+xml"});
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `MultiGroup_Figure_${new Date().getTime()}.svg`;
    link.click();
}

// 初期グループの作成
addNewGroup("WT", "#ffffff", "Day1\tDay3\tDay7\n100\t250\t400\n120\t280\t450\n90\t230\t380");
addNewGroup("KO", "#ffcccc", "80\t150\t200\n70\t140\t220\n85\t160\t190");

const resizer = document.getElementById("resizerHandle");
const leftPanel = document.getElementById("leftPanel");

resizer.addEventListener("mousedown", function(e) {
    e.preventDefault();
    document.addEventListener("mousemove", resize);
    document.addEventListener("mouseup", stopResize);
    resizer.style.background = "#007bff";
});

function resize(e) {
    const newWidth = e.clientX;
    if (newWidth > 250 && newWidth < 800) {
        leftPanel.style.flex = `0 0 ${newWidth}px`;
    }
}

function stopResize() {
    document.removeEventListener("mousemove", resize);
    resizer.style.background = "";
}
</script>
